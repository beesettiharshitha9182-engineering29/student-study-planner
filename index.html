
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Study Planner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f2fc;
    color: #29243b;
}

header {
    background: #7254cf;
    color: white;
    padding: 22px 6%;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 7px;
    opacity: .9;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    font-size: 25px;
    margin-bottom: 8px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 13px;
    box-shadow: 0 3px 12px #0000000a;
}

.card p {
    color: #777;
    margin-bottom: 12px;
}

.card h2 {
    color: #7254cf;
    font-size: 29px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 13px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px #0000000a;
}

.panel h3 {
    margin-bottom: 20px;
}

form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
    background: white;
}

input:focus, select:focus {
    border-color: #7254cf;
}

button {
    border: none;
    padding: 12px 18px;
    background: #7254cf;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #583bb3;
}

.add-button {
    grid-column: span 2;
}

.progress-bg {
    height: 12px;
    background: #eeeaf8;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 12px;
}

.progress-fill {
    height: 100%;
    background: #7254cf;
    width: 0%;
    transition: .3s;
}

.task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.task:last-child {
    border-bottom: none;
}

.task-info {
    flex: 1;
}

.task-info h4 {
    margin-bottom: 6px;
}

.task-info p {
    font-size: 13px;
    color: #777;
}

.completed h4 {
    text-decoration: line-through;
    color: #999;
}

.task-actions {
    display: flex;
    gap: 7px;
}

.done-btn {
    background: #269c69;
    font-size: 12px;
    padding: 9px;
}

.delete-btn {
    background: #e25353;
    font-size: 12px;
    padding: 9px;
}

.empty {
    color: #888;
    text-align: center;
    padding: 25px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

@media(max-width:650px) {
    .cards {
        grid-template-columns: 1fr;
    }

    form {
        grid-template-columns: 1fr;
    }

    .add-button {
        grid-column: span 1;
    }

    .task {
        align-items: flex-start;
    }

    .task-actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Smart Study Planner</h1>
    <p>Plan your day. Track your progress. Achieve your goals.</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Welcome, Student! 👋</h2>
        <p id="today"></p>
    </div>

    <div class="cards">

        <div class="card">
            <p>Total Study Tasks</p>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <p>Completed Tasks</p>
            <h2 id="completed">0</h2>
        </div>

        <div class="card">
            <p>Pending Tasks</p>
            <h2 id="pending">0</h2>
        </div>

    </div>

    <div class="panel">
        <h3>📊 Your Study Progress</h3>
        <p id="progressText">0% completed</p>
        <div class="progress-bg">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="panel">

        <h3>➕ Add New Study Task</h3>

        <form id="taskForm">

            <input
                type="text"
                id="taskName"
                placeholder="Enter task name"
                required
            >

            <select id="subject" required>
                <option value="">Select Subject</option>
                <option>Python</option>
                <option>Java</option>
                <option>Data Structures</option>
                <option>Mathematics</option>
                <option>DBMS</option>
                <option>Other</option>
            </select>

            <input
                type="date"
                id="studyDate"
                required
            >

            <input
                type="number"
                id="duration"
                placeholder="Study duration (minutes)"
                min="1"
                required
            >

            <button class="add-button" type="submit">
                + Add Study Task
            </button>

        </form>

    </div>

    <div class="panel">
        <h3>📝 My Study Tasks</h3>
        <div id="taskList"></div>
    </div>

</div>

<footer>
    Smart Study Planner | Made with HTML, CSS & JavaScript ❤️
</footer>

<script>

let tasks = JSON.parse(
    localStorage.getItem("studyTasks")
) || [];

const today = new Date().toISOString().split("T")[0];

document.getElementById("today").textContent =
    "Today: " + new Date().toLocaleDateString(
        "en-IN",
        {weekday:"long", day:"numeric", month:"long", year:"numeric"}
    );

document.getElementById("studyDate").value = today;
document.getElementById("studyDate").min = today;

function saveTasks() {
    localStorage.setItem("studyTasks", JSON.stringify(tasks));
}

function renderTasks() {

    const list = document.getElementById("taskList");
    list.innerHTML = "";

    if (tasks.length === 0) {
        list.innerHTML =
            '<div class="empty">No study tasks yet. Add your first task! 📖</div>';
    }

    tasks.forEach((task, index) => {

        const div = document.createElement("div");
        div.className = "task";

        if (task.done) {
            div.classList.add("completed");
        }

        const info = document.createElement("div");
        info.className = "task-info";

        const title = document.createElement("h4");
        title.textContent = task.name;

        const details = document.createElement("p");
        details.textContent =
            task.subject + " | " + task.date +
            " | " + task.duration + " minutes";

        info.append(title, details);

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const doneBtn = document.createElement("button");
        doneBtn.className = "done-btn";
        doneBtn.textContent = task.done ? "Completed ✓" : "Mark Done";

        doneBtn.onclick = () => {
            tasks[index].done = !tasks[index].done;
            saveTasks();
            renderTasks();
        };

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";

        deleteBtn.onclick = () => {
            if (confirm("Delete this study task?")) {
                tasks.splice(index, 1);
                saveTasks();
                renderTasks();
            }
        };

        actions.append(doneBtn, deleteBtn);
        div.append(info, actions);
        list.appendChild(div);

    });

    updateDashboard();
}

function updateDashboard() {

    const total = tasks.length;
    const completed = tasks.filter(t => t.done).length;
    const pending = total - completed;

    const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("total").textContent = total;
    document.getElementById("completed").textContent = completed;
    document.getElementById("pending").textContent = pending;

    document.getElementById("progressText").textContent =
        percentage + "% completed";

    document.getElementById("progressBar").style.width =
        percentage + "%";
}

document.getElementById("taskForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        const name = document.getElementById("taskName").value.trim();
        const subject = document.getElementById("subject").value;
        const date = document.getElementById("studyDate").value;
        const duration = Number(
            document.getElementById("duration").value
        );

        if (!name || !subject || !date || duration <= 0) {
            alert("Please enter valid task details.");
            return;
        }

        tasks.push({
            name: name,
            subject: subject,
            date: date,
            duration: duration,
            done: false
        });

        saveTasks();
        renderTasks();

        this.reset();
        document.getElementById("studyDate").value = today;

        alert("Study task added successfully!");

    }
);

renderTasks();

</script>

</body>
</html>
